  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif">
        <h1>SyntaxHue</h1>
        <p>
          SyntaxHue is a free web app that makes color themes for Visual Studio Code. Shuffle colors, tune what you
          like, check contrast, then paste the result into settings.json or export it as an extension. The same colors
          also export for Zed, Sublime Text, Neovim, JetBrains IDEs and terminals such as iTerm2, Ghostty, Alacritty,
          Kitty, WezTerm, Warp and macOS Terminal.
        </p>
        <p>It needs JavaScript to run. Everything happens in your browser; nothing is uploaded.</p>

      </main>
    </noscript>
